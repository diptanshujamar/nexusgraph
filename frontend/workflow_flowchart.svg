<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%" style="background-color: #070a12; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="50%" stop-color="#0d1322"/>
      <stop offset="100%" stop-color="#080c16"/>
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Filters & Glow -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>

    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>

    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>

    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>

    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background Grid Canvas -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="1600" height="900" fill="url(#gridPattern)"/>
  </g>

  <!-- Top Title Banner -->
  <g transform="translate(80, 45)">
    <rect x="0" y="0" width="1440" height="60" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="30" cy="30" r="12" fill="#ef4444" opacity="0.8"/>
    <text x="55" y="37" font-size="22" font-weight="800" fill="#f8fafc" letter-spacing="1">NEXUS-GRAPH <tspan fill="#38bdf8">// AI-POWERED CRIMINAL NETWORK ANALYSIS SYSTEM</tspan></text>
    <rect x="1170" y="16" width="245" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="1292" y="35" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="0.5">SMART INDIA HACKATHON 2026</text>
  </g>

  <!-- ==================== FLOWCHART NODES ==================== -->

  <!-- 1. START NODE: Raw Data Hub -->
  <g id="node-start" transform="translate(80, 150)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="280" height="110" rx="12" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
    <rect x="0" y="0" width="280" height="28" rx="12" fill="url(#blueGrad)" opacity="0.9"/>
    <rect x="0" y="14" width="280" height="14" fill="url(#blueGrad)" opacity="0.9"/>
    <text x="140" y="19" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">START: RAW DATA INGESTION</text>
    
    <text x="20" y="52" font-size="13" font-weight="700" fill="#f8fafc">• Multi-Modal Police Data</text>
    <text x="30" y="72" font-size="11" fill="#94a3b8">Unstructured FIR Narratives (Text)</text>
    <text x="30" y="88" font-size="11" fill="#94a3b8">Call Detail Records (CDR CSVs)</text>
    <text x="30" y="104" font-size="11" fill="#94a3b8">Banking / Mule Transaction Logs</text>
  </g>

  <!-- Flow 1 -> 2 -->
  <path d="M 220 260 L 220 300" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowCyan)"/>

  <!-- 2. LEGAL CRYPTOGRAPHY NODE: SHA-256 Chain of Custody -->
  <g id="node-crypto" transform="translate(80, 305)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="280" height="115" rx="12" fill="#0f172a" stroke="#d97706" stroke-width="2"/>
    <rect x="0" y="0" width="280" height="28" rx="12" fill="url(#amberGrad)" opacity="0.9"/>
    <rect x="0" y="14" width="280" height="14" fill="url(#amberGrad)" opacity="0.9"/>
    <text x="140" y="19" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">CHAIN OF CUSTODY (BSA 2023)</text>
    
    <text x="20" y="52" font-size="13" font-weight="700" fill="#f59e0b">• Zero-Day Legal Cryptography</text>
    <text x="30" y="72" font-size="11" fill="#cbd5e1">Instant SHA-256 Byte Fingerprinting</text>
    <text x="30" y="88" font-size="11" fill="#cbd5e1">Sec 63(4)(a) Operator Declaration</text>
    <text x="30" y="104" font-size="11" fill="#cbd5e1">Sec 63(4)(b) Examiner Certificate</text>
  </g>

  <!-- Flow 2 -> 3 -->
  <path d="M 360 362 L 420 362" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowCyan)"/>

  <!-- 3. NLP & ENTITY RESOLUTION NODE -->
  <g id="node-nlp" transform="translate(425, 290)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="300" height="145" rx="12" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
    <rect x="0" y="0" width="300" height="28" rx="12" fill="url(#cyanGrad)" opacity="0.9"/>
    <rect x="0" y="14" width="300" height="14" fill="url(#cyanGrad)" opacity="0.9"/>
    <text x="150" y="19" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">FORENSIC NLP & FUZZY RESOLUTION</text>
    
    <text x="20" y="50" font-size="12" font-weight="700" fill="#38bdf8">• spaCy Entity Recognition (NER):</text>
    <text x="30" y="68" font-size="11" fill="#cbd5e1">PERSON, LOC, BANK_ACC (9-18 digits)</text>
    <text x="30" y="84" font-size="11" fill="#cbd5e1">Indian RTO Plates (DL, MH, KA, WB)</text>
    
    <text x="20" y="106" font-size="12" font-weight="700" fill="#38bdf8">• Levenshtein Dynamic Programming:</text>
    <text x="30" y="124" font-size="11" fill="#cbd5e1">Edit Dist ≤ 2 Merge (Rahul == Raahul)</text>
    <text x="30" y="138" font-size="11" fill="#10b981">✓ Eliminates Fragmented Duplicate Nodes</text>
  </g>

  <!-- Flow 3 -> 4 -->
  <path d="M 725 362 L 785 362" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowCyan)"/>

  <!-- 4. IN-MEMORY GRAPH NODE (NetworkX) -->
  <g id="node-graph" transform="translate(790, 285)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="300" height="155" rx="12" fill="#0f172a" stroke="#9333ea" stroke-width="2"/>
    <rect x="0" y="0" width="300" height="28" rx="12" fill="url(#purpleGrad)" opacity="0.9"/>
    <rect x="0" y="14" width="300" height="14" fill="url(#purpleGrad)" opacity="0.9"/>
    <text x="150" y="19" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">NETWORKX MULTI-RELATIONAL GRAPH</text>
    
    <text x="20" y="50" font-size="12" font-weight="700" fill="#c084fc">• 6 Node Classes / 6 Directed Edges:</text>
    <text x="30" y="68" font-size="11" fill="#cbd5e1">Suspect, Phone, Account, Vehicle, LOC, FIR</text>
    <text x="30" y="84" font-size="11" fill="#cbd5e1">TRANSFERRED_TO, COMMUNICATED_WITH</text>
    
    <text x="20" y="108" font-size="12" font-weight="700" fill="#c084fc">• nx.betweenness_centrality():</text>
    <text x="30" y="126" font-size="11" fill="#cbd5e1">Calculates Shortest-Path Broker Power</text>
    <text x="30" y="142" font-size="11" fill="#e2e8f0">Dynamic Circle Radius: <tspan fill="#f59e0b" font-weight="700">Radius = 12 + 40·Cb</tspan></text>
  </g>

  <!-- Flow 4 -> 5 -->
  <path d="M 1090 362 L 1150 362" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowCyan)"/>

  <!-- 5. DECISION DIAMOND: Threat or Pattern Detected? -->
  <g id="node-decision1" transform="translate(1155, 292)" filter="url(#cardShadow)">
    <polygon points="120,0 240,70 120,140 0,70" fill="#1e1b4b" stroke="#ef4444" stroke-width="2.5"/>
    <text x="120" y="62" font-size="13" font-weight="800" fill="#f8fafc" text-anchor="middle">THREAT OR</text>
    <text x="120" y="78" font-size="13" font-weight="800" fill="#f8fafc" text-anchor="middle">PATTERN DETECTED?</text>
  </g>

  <!-- Branch NO: Passive Monitoring (Top loop) -->
  <path d="M 1275 292 L 1275 200 L 940 200" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowGray)"/>
  <rect x="1285" y="235" width="40" height="20" rx="4" fill="#0f172a" stroke="#475569"/>
  <text x="1305" y="249" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">NO</text>
  
  <g transform="translate(680, 160)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="250" height="60" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="125" y="26" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle">PASSIVE MONITORING</text>
    <text x="125" y="45" font-size="11" fill="#64748b" text-anchor="middle">Continuous In-Memory Indexing</text>
  </g>

  <!-- Branch YES: Downwards to Threat Flagging -->
  <path d="M 1275 432 L 1275 490" fill="none" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <rect x="1285" y="445" width="45" height="20" rx="4" fill="#0f172a" stroke="#ef4444"/>
  <text x="1307" y="459" font-size="11" font-weight="800" fill="#ef4444" text-anchor="middle">YES</text>

  <!-- 6. AI PATTERN FLAGGING SUITE -->
  <g id="node-threats" transform="translate(1125, 495)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="300" height="150" rx="12" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="300" height="28" rx="12" fill="url(#redGrad)" opacity="0.9"/>
    <rect x="0" y="14" width="300" height="14" fill="url(#redGrad)" opacity="0.9"/>
    <text x="150" y="19" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">AUTONOMOUS THREAT ENGINES</text>
    
    <text x="20" y="50" font-size="12" font-weight="700" fill="#ef4444">1. SIM Churn (Bipartite Matching):</text>
    <text x="30" y="66" font-size="11" fill="#cbd5e1">Target Overlap ≥ 85% on Deactivated Line</text>
    
    <text x="20" y="86" font-size="12" font-weight="700" fill="#f59e0b">2. BTS Co-Location Engine:</text>
    <text x="30" y="102" font-size="11" fill="#cbd5e1">Cell Tower Ping Delta ≤ 10 Minutes</text>

    <text x="20" y="122" font-size="12" font-weight="700" fill="#38bdf8">3. Logistics Filter (Women's Safety):</text>
    <text x="30" y="138" font-size="11" fill="#cbd5e1">Transit Tickets + Short Hotel Bookings</text>
  </g>

  <!-- Flow 6 -> 7 (Leftwards to Confirmation) -->
  <path d="M 1125 570 L 1035 570" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrowAmber)"/>

  <!-- 7. DECISION DIAMOND: Investigator Confirms? -->
  <g id="node-decision2" transform="translate(805, 500)" filter="url(#cardShadow)">
    <polygon points="110,0 220,70 110,140 0,70" fill="#1e1b4b" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="110" y="62" font-size="13" font-weight="800" fill="#f8fafc" text-anchor="middle">INVESTIGATOR</text>
    <text x="110" y="78" font-size="13" font-weight="800" fill="#f8fafc" text-anchor="middle">CONFIRMS LEAD?</text>
    <text x="110" y="96" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="middle">(Analyst-in-the-Loop)</text>
  </g>

  <!-- Flow 7 -> 8 (Leftwards to Dashboard) -->
  <path d="M 805 570 L 715 570" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <rect x="730" y="555" width="65" height="20" rx="4" fill="#0f172a" stroke="#10b981"/>
  <text x="762" y="569" font-size="10" font-weight="800" fill="#10b981" text-anchor="middle">CONFIRM</text>

  <!-- 8. COMMAND DASHBOARD VIEW -->
  <g id="node-ui" transform="translate(415, 495)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="295" height="150" rx="12" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
    <rect x="0" y="0" width="295" height="28" rx="12" fill="url(#blueGrad)" opacity="0.9"/>
    <rect x="0" y="14" width="295" height="14" fill="url(#blueGrad)" opacity="0.9"/>
    <text x="147" y="19" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">TACTICAL COMMAND DASHBOARD</text>
    
    <text x="20" y="50" font-size="12" font-weight="700" fill="#38bdf8">• D3.js v7 Sky Blue Canvas (#87CEEB):</text>
    <text x="30" y="66" font-size="11" fill="#cbd5e1">Interactive Force Graph + Pulsing Threat Halos</text>
    
    <text x="20" y="86" font-size="12" font-weight="700" fill="#c084fc">• Victim Demographics Analytics:</text>
    <text x="30" y="102" font-size="11" fill="#cbd5e1">Suspect vs Age Impact & Gender Vulnerability</text>

    <text x="20" y="122" font-size="12" font-weight="700" fill="#f59e0b">• Leaflet.js Geospatial Heatmap:</text>
    <text x="30" y="138" font-size="11" fill="#cbd5e1">Active BTS Towers & Trafficking Corridors</text>
  </g>

  <!-- Flow 8 -> 9 (Leftwards to Dispatch) -->
  <path d="M 415 570 L 355 570" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <!-- 9. ONE-CLICK DISPATCH & LEGAL PDF EXPORT -->
  <g id="node-dispatch" transform="translate(80, 495)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="270" height="150" rx="12" fill="#0f172a" stroke="#059669" stroke-width="2"/>
    <rect x="0" y="0" width="270" height="28" rx="12" fill="url(#greenGrad)" opacity="0.9"/>
    <rect x="0" y="14" width="270" height="14" fill="url(#greenGrad)" opacity="0.9"/>
    <text x="135" y="19" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">ONE-CLICK DISPATCH & LEGAL PDF</text>
    
    <text x="20" y="50" font-size="12" font-weight="700" fill="#10b981">• Section 63(4) BSA 2023 PDF:</text>
    <text x="30" y="66" font-size="11" fill="#cbd5e1">Two-Part Court-Admissible Certificate</text>
    <text x="30" y="80" font-size="11" fill="#cbd5e1">Immutable SHA-256 Digest Printed</text>
    
    <text x="20" y="104" font-size="12" font-weight="700" fill="#38bdf8">• CCTNS All-Points Bulletin (APB):</text>
    <text x="30" y="120" font-size="11" fill="#cbd5e1">Encrypted Interstate Dispatch (&lt;50ms)</text>
    <text x="30" y="136" font-size="11" fill="#cbd5e1">8 State Police Cyber Cells Synced</text>
  </g>

  <!-- Flow 9 -> 10 (Downwards to End) -->
  <path d="M 215 645 L 215 705" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <!-- 10. END NODE: Command Centers Updated -->
  <g id="node-end" transform="translate(80, 715)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="1440" height="65" rx="32" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <rect x="8" y="8" width="1424" height="49" rx="25" fill="url(#greenGrad)" opacity="0.2"/>
    <circle cx="45" cy="32" r="16" fill="#10b981" opacity="0.9"/>
    <text x="45" y="38" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">✓</text>
    
    <text x="75" y="32" font-size="15" font-weight="800" fill="#ffffff" letter-spacing="1">END: INTER-AGENCY TACTICAL INTERCEPT & JUDICIAL PROSECUTION COMPLETE</text>
    <text x="75" y="50" font-size="12" fill="#a7f3d0">State Cyber Police (Delhi, Mumbai, Bengaluru, Kolkata, Jaipur, Hyderabad) Synced • Fugitive FASTag Toll Flags Active • 100% BSA 2023 Proof</text>
  </g>

  <!-- Bottom Legend Bar -->
  <g transform="translate(80, 810)">
    <rect x="0" y="0" width="1440" height="50" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
    <text x="30" y="30" font-size="12" font-weight="800" fill="#94a3b8" letter-spacing="1">FLOW LEGEND:</text>
    
    <circle cx="170" cy="25" r="7" fill="#0284c7"/>
    <text x="185" y="30" font-size="12" fill="#e2e8f0">Data Intake</text>
    
    <circle cx="310" cy="25" r="7" fill="#d97706"/>
    <text x="325" y="30" font-size="12" fill="#e2e8f0">Legal Chain of Custody</text>
    
    <circle cx="510" cy="25" r="7" fill="#06b6d4"/>
    <text x="525" y="30" font-size="12" fill="#e2e8f0">NLP & Levenshtein</text>

    <circle cx="700" cy="25" r="7" fill="#9333ea"/>
    <text x="715" y="30" font-size="12" fill="#e2e8f0">NetworkX & Centrality</text>
    
    <polygon points="885,25 892,18 899,25 892,32" fill="#ef4444"/>
    <text x="910" y="30" font-size="12" fill="#e2e8f0">Threat Decision Diamond</text>
    
    <circle cx="1130" cy="25" r="7" fill="#10b981"/>
    <text x="1145" y="30" font-size="12" fill="#e2e8f0">Confirmed Action & CCTNS APB</text>
  </g>
</svg>
